<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Yibra - Comms down</title>
  <style>
    :root { --bg:#2a2728; --surface:#373435; --border:#4A4748; --text:#FEFEFE; --sub:#BDBFC1; --muted:#848688; --accent:#EA7737; }
    * { box-sizing: border-box; }
    body { margin:0; height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
           font-family: "Segoe UI", system-ui, sans-serif; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:36px 40px;
            max-width:440px; text-align:center; }
    .badge { width:56px; height:56px; border-radius:50%; background:var(--accent); display:grid; place-items:center;
             margin:0 auto 18px; font-weight:800; font-size:28px; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { color:var(--sub); margin:0 0 20px; line-height:1.5; }
    .err { color:var(--muted); font-size:12px; margin-top:16px; font-family: Consolas, monospace; }
    button { background:var(--accent); color:var(--text); border:0; border-radius:8px; padding:10px 22px;
             font-size:14px; font-weight:600; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Y</div>
    <h1 id="title">Comms are down, soldier</h1>
    <p id="msg">Can't reach the Yibra server. Check your connection - we'll keep trying every 10 seconds.</p>
    <button id="retry">Retry now</button>
    <div class="err" id="err"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const err = params.get('error');
    if (err) document.getElementById('err').textContent = err;

    // Same page, different story depending on whose fault it is (v0.3.5).
    const copy = {
      server: ['HQ isn\'t answering',
               'The Yibra server hit a snag - it\'s not your connection. We\'ll keep trying every 10 seconds.'],
      updating: ['HQ is being upgraded',
                 'Yibra is updating right now. Hang tight - we\'ll reconnect every 10 seconds until it\'s back.'],
    }[params.get('kind')];
    if (copy) {
      document.getElementById('title').textContent = copy[0];
      document.getElementById('msg').textContent = copy[1];
    }
    const retry = () => window.yibraDesktop && window.yibraDesktop.retry();
    document.getElementById('retry').addEventListener('click', retry);
    setInterval(retry, 10000);
  </script>
</body>
</html>
