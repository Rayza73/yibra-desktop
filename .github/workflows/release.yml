# Builds the Windows installer and publishes it as a GitHub Release whenever
# a version tag (v1.2.3) is pushed. Installed Yibra apps pick it up from there.
#
#   pnpm version patch     # bumps package.json + creates tag v0.3.1
#   git push --follow-tags # push the commit AND the tag -> this workflow runs
#
# Flow: electron-builder builds (no publishing) -> gh uploads everything to a
# DRAFT release -> verify all three update files are attached -> publish.
# A half-uploaded release can never go live.
#
# Uses the built-in GITHUB_TOKEN, so no personal access token anywhere.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the release + upload the installer

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Check tag matches package.json version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "$env:TAG".TrimStart('v')
          if ($pkg -ne $tag) {
            Write-Error "Tag v$tag does not match package.json version $pkg. Use 'pnpm version patch' to bump both together."
            exit 1
          }
          Write-Host "Releasing Yibra v$pkg"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder only BUILDS here. Its own GitHub uploader races itself
      # (two publishers -> two releases, files split between them), so the
      # gh CLI does the uploading. latest.yml + the app's update feed config
      # still come from the "publish" block in package.json.
      - name: Build installer
        run: pnpm run dist

      - name: Show what was built
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, Length

      # Creates the draft, or reuses it if this is a re-run of a failed job.
      - name: Upload to draft release
        shell: pwsh
        run: |
          $files = @('dist/Yibra-Setup.exe', 'dist/Yibra-Setup.exe.blockmap', 'dist/latest.yml')
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG already exists - re-uploading files to it"
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --draft --title "Yibra $env:TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Retries a few times in case GitHub's asset list lags behind the upload.
      - name: Verify draft has all update files
        shell: pwsh
        run: |
          $required = @('Yibra-Setup.exe', 'Yibra-Setup.exe.blockmap', 'latest.yml')
          for ($i = 1; $i -le 6; $i++) {
            $assets = (gh release view $env:TAG --json assets | ConvertFrom-Json).assets
            $missing = $required | Where-Object { $_ -notin $assets.name }
            if (-not $missing) { break }
            Write-Host "Attempt ${i}: still missing $($missing -join ', ') - waiting 10s"
            Start-Sleep -Seconds 10
          }
          $assets | Format-Table name, size, state
          if ($missing) {
            Write-Error "Release $env:TAG is missing: $($missing -join ', '). Not publishing."
            exit 1
          }
          Write-Host "All update files present."

      - name: Publish release
        run: gh release edit ${{ github.ref_name }} --draft=false --latest
